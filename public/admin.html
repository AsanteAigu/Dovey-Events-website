<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookings — Dovey Events admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/img/dovey-logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/mobile.css" />
</head>
<body class="admin-body">
  <form class="admin-login" id="login" hidden>
    <a class="brand" href="/"><img src="/img/dovey-logo.png" alt="" width="34" height="31" />Dovey<small>Events</small></a>
    <h1>Bookings</h1>
    <div class="field">
      <label for="password">Admin password</label>
      <input class="input" type="password" id="password" name="password" autocomplete="current-password" required />
    </div>
    <button class="btn btn-block" type="submit">Sign in</button>
    <div class="alert alert-bad" role="alert"></div>
  </form>

  <div id="dashboard" hidden>
    <header class="site-header on-paper">
      <div class="wrap">
        <a class="brand" href="/"><img src="/img/dovey-logo.png" alt="" width="34" height="31" />Dovey<small>Events</small></a>
        <nav class="nav">
          <button class="btn btn-ghost btn-sm" type="button" id="refresh">Refresh</button>
          <button class="btn btn-sm" type="button" id="logout">Sign out</button>
        </nav>
      </div>
    </header>

    <main class="wrap section flush-top">
      <div class="page-head">
        <span class="eyebrow">Admin</span>
        <h1>Bookings</h1>
      </div>

      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <div class="tabs" id="tabs" role="group" aria-label="Filter by status"></div>
        <input class="input status-select" type="search" id="search" placeholder="Search name, email, reference…" aria-label="Search bookings" />
      </div>

      <div class="alert alert-bad" id="dash-alert" role="alert"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Reference</th>
              <th>Client</th>
              <th>Event</th>
              <th>Total</th>
              <th>Paid</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
